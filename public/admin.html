<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Rekha owner dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { padding-bottom: 24px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .tile b { display: block; font-size: .75rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
    .tile span { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; }
  </style>
</head>
<body>
  <header class="site-head"><div class="bar"><div class="brand"><span class="mark">रे</span> Owner dashboard</div></div></header>
  <main>
    <form id="f" class="card two"><input id="tok" type="password" placeholder="Admin token" aria-label="Admin token"><button class="primary">Open</button></form>
    <div id="out"></div>
  </main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
    async function load(tok) {
      const r = await fetch('/api/admin/stats', { headers: { 'x-admin-token': tok } });
      if (!r.ok) { document.getElementById('out').innerHTML = '<div class="card q-bad">Wrong token.</div>'; return; }
      try { sessionStorage.setItem('rk_admin', tok); } catch {}
      const s = await r.json();
      const subs = Object.fromEntries(s.subscribers.map((x) => [x.plan, x.n]));
      const totalSubs = s.subscribers.reduce((a, x) => a + x.n, 0);
      document.getElementById('out').innerHTML = `
        <div class="tiles">
          <div class="tile"><b>Users</b><span>${s.users}</span></div>
          <div class="tile"><b>New this week</b><span>${s.newUsers7d}</span></div>
          <div class="tile"><b>Paying</b><span>${totalSubs}</span></div>
          <div class="tile"><b>MRR (incl. GST)</b><span>${inr(s.mrrInr)}</span></div>
          <div class="tile"><b>AI cost this month</b><span>${inr(s.aiCostInrThisMonth)}</span></div>
          <div class="tile"><b>Conversion</b><span>${s.users ? ((totalSubs / s.users) * 100).toFixed(1) : 0}%</span></div>
          <div class="tile"><b>AI budget used</b><span>${s.ai.budgetUsedPct ?? '-'}${s.ai.budgetUsd ? '%' : ''}</span><small class="hint">${s.ai.budgetUsd ? `$${s.ai.spentUsd} of $${s.ai.budgetUsd}` : 'No cap set'}</small></div>
          <div class="tile"><b>Prompt cache hits</b><span>${s.ai.cacheHitPct}%</span><small class="hint">of input tokens, mode: ${esc(s.ai.cacheMode)}</small></div>
        </div>
        <div class="card"><h2>Find a customer</h2>
          <form id="findF" class="two"><input id="findQ" placeholder="Mobile, email or name"><button class="ghost">Search</button></form>
          <div id="findOut"></div></div>
        <div class="card" id="funCard"><h2>Funnel, last 30 days</h2><p class="hint">Loading…</p></div>
        <div class="card" id="audCard"><h2>Audience</h2><p class="hint">Loading…</p></div>
        <div class="card" id="pushCard"><h2>Send a push message</h2>
          <p class="hint">Goes to phones that turned on alerts and allowed festival reminders and news. Keep it useful: a festival, a new feature, an important change. One or two a month at most, or people turn alerts off.</p>
          <form id="cmpF" class="form">
            <input name="title" maxlength="80" placeholder="Title, e.g. Diwali muhurat for your city" required>
            <input name="body" maxlength="200" placeholder="Message (up to 200 characters)" required>
            <input name="url" placeholder="Opens (path), e.g. /festivals/diwali" value="/">
            <div class="two"><input name="langs" placeholder="Languages, e.g. hi,gu (empty = all)"><input name="countries" placeholder="Countries, e.g. IN,AE (empty = all)"></div>
            <div class="two"><select name="audience"><option value="all">Everyone with alerts</option><option value="accounts">Signed-in users</option><option value="guests">No account</option><option value="paid">Paying</option><option value="free">Free</option></select>
              <input name="at" type="datetime-local" aria-label="Send at (empty = now)"></div>
            <p class="hint" id="cmpCount">Audience: …</p>
            <button class="primary">Schedule</button>
          </form>
          <div id="cmpList"></div></div>
        <div class="card" id="mailCard"><h2>Email</h2><p class="hint">Loading…</p></div>
        <div class="card" id="bkCard"><h2>Backups</h2><p class="hint">Loading…</p></div>
        <div class="card" id="trCard"><h2>Languages</h2><p class="hint">Loading…</p></div>
        <div class="card"><h2>Plans</h2><table><tr><th>Solo ₹49</th><th>Couple ₹99</th><th>Family ₹199</th></tr>
          <tr><td>${subs.solo || 0}</td><td>${subs.couple || 0}</td><td>${subs.family || 0}</td></tr></table></div>
        <div class="card"><h2>AI usage this month</h2><table><tr><th>Kind</th><th>Calls</th><th>USD</th><th>Avg per call</th><th>Cached</th></tr>
          ${s.aiByKind.map((k) => `<tr><td>${esc(k.kind)}</td><td>${k.calls}</td><td>$${k.usd}</td><td>₹${(k.avg_usd * 88).toFixed(2)}</td><td>${k.tokens_in ? Math.round((k.cache_read / k.tokens_in) * 100) : 0}%</td></tr>`).join('') || '<tr><td colspan=5>None yet</td></tr>'}</table></div>
        <div class="card"><h2>Sign-ups, last 30 days</h2><table><tr><th>Day</th><th>New users</th></tr>
          ${s.signupsByDay.map((d) => `<tr><td>${esc(d.day)}</td><td>${d.n}</td></tr>`).join('') || '<tr><td colspan=2>None yet</td></tr>'}</table></div>
        <div class="card"><h2>Recent payment events</h2><table><tr><th>Event</th><th>Subscription</th><th>When</th></tr>
          ${s.recentBilling.map((e) => `<tr><td>${esc(e.type)}</td><td>${esc(e.subscription_id)}</td><td>${new Date(e.received_at).toLocaleString('en-IN')}</td></tr>`).join('') || '<tr><td colspan=3>None yet</td></tr>'}</table></div>`;
      loadLangs(); loadAudience(); loadBackups(); loadEmail(); loadFunnel();
    }
    const H = () => ({ 'x-admin-token': sessionStorage.getItem('rk_admin'), 'content-type': 'application/json' });
    async function download(path, name) {
      const res = await fetch(path, { headers: H() });
      if (!res.ok) return alert('Download failed');
      const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name; a.click();
    }
    // Audience: who can be reached, exports, push campaigns.
    async function loadAudience() {
      const r = await fetch('/api/admin/audience', { headers: H() }); if (!r.ok) return;
      const a = await r.json(); const p = a.push || {};
      document.getElementById('audCard').innerHTML = `<h2>Audience</h2>
        <div class="tiles">
          <div class="tile"><b>Accounts</b><span>${a.accounts}</span></div>
          <div class="tile"><b>Agreed to updates</b><span>${a.optedIn}</span><small class="hint">accounts that ticked the box</small></div>
          <div class="tile"><b>Email list</b><span>${a.emailList}</span><small class="hint">${a.emailUnsubscribed} unsubscribed</small></div>
          <div class="tile"><b>Phones with alerts</b><span>${p.n || 0}</span><small class="hint">${p.news || 0} allow news · ${p.linked || 0} signed in</small></div>
        </div>
        <div class="two"><button class="ghost" id="expM">Download marketing list (CSV)</button><button class="ghost" id="expA">Download all accounts (CSV)</button></div>
        <p class="hint">The marketing list only has people who agreed: accounts that ticked the box and the email list, each with the consent date and, for the email list, a personal unsubscribe link. Import it into an email tool (Brevo, Mailchimp, Resend) and include the unsubscribe link in every email.</p>
        <details><summary>Alerts by language and country</summary><table><tr><th>Language</th><th>Phones</th></tr>${a.pushByLang.map((x) => `<tr><td>${esc(x.lang)}</td><td>${x.n}</td></tr>`).join('')}</table>
          <table><tr><th>Country</th><th>Phones</th></tr>${a.pushByCountry.map((x) => `<tr><td>${esc(x.country)}</td><td>${x.n}</td></tr>`).join('')}</table></details>
        <details><summary>Email sign-ups by page</summary><table>${a.emailBySource.map((x) => `<tr><td>${esc(x.source)}</td><td>${x.n}</td></tr>`).join('') || '<tr><td>None yet</td></tr>'}</table></details>`;
      document.getElementById('expM').onclick = () => download('/api/admin/export/marketing.csv', 'rekha-marketing.csv');
      document.getElementById('expA').onclick = () => download('/api/admin/export/accounts.csv', 'rekha-accounts.csv');
      document.getElementById('cmpList').innerHTML = a.campaigns.length ? `<h3>Messages</h3><table><tr><th>When</th><th>Message</th><th>Status</th><th>Sent</th><th></th></tr>${a.campaigns.map((c) => `<tr><td>${new Date(c.scheduled_at).toLocaleString('en-IN')}</td><td><strong>${esc(c.title)}</strong><br><small>${esc(c.body)}</small></td><td>${esc(c.status)}</td><td>${c.sent}${c.failed ? ` (${c.failed} failed)` : ''}${c.gone ? ` · ${c.gone} removed` : ''}</td><td>${c.status === 'scheduled' ? `<button class="ghost small" data-cancel="${c.id}">Cancel</button>` : ''}</td></tr>`).join('')}</table>` : '';
      document.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => { await fetch(`/api/admin/campaigns/${b.dataset.cancel}/cancel`, { method: 'POST', headers: H() }); loadAudience(); });
      countAudience();
    }
    const segOf = (f) => ({ langs: f.langs.value, countries: f.countries.value.toUpperCase(), audience: f.audience.value });
    async function countAudience() {
      const f = document.getElementById('cmpF');
      const r = await fetch('/api/admin/audience/count?' + new URLSearchParams(segOf(f)), { headers: H() });
      if (r.ok) document.getElementById('cmpCount').textContent = `Audience: ${(await r.json()).n} phones`;
    }
    document.addEventListener('input', (e) => { if (e.target.closest('#cmpF') && ['langs', 'countries', 'audience'].includes(e.target.name)) countAudience(); });
    // Funnel from the first-party event log (works even when GA4 is blocked). People = distinct devices.
    async function loadFunnel() {
      const r = await fetch('/api/admin/funnel?days=30', { headers: H() }); if (!r.ok) return;
      const f = await r.json(); const e = f.events;
      const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '-');
      const steps = [['Visitors', f.visitors], ['Turned on alerts', e.alerts_on.people], ['Installed the app', e.app_installed.people], ['Free reading', e.free_reading.people], ['Signed up', e.sign_up.people], ['Opened plans', e.plans_view.people], ['Started checkout', e.checkout_start.people], ['Paid', e.purchase.people]];
      document.getElementById('funCard').innerHTML = `<h2>Funnel, last 30 days</h2>
        <div class="tiles">
          <div class="tile"><b>Visitors</b><span>${f.visitors}</span></div>
          <div class="tile"><b>Came back (2+ days)</b><span>${pct(f.returning, f.visitors)}</span><small class="hint">${f.returning} people</small></div>
          <div class="tile"><b>Week-1 return</b><span>${pct(f.week1.back, f.week1.cohort)}</span><small class="hint">of ${f.week1.cohort} new 8 to 14 days ago</small></div>
          <div class="tile"><b>Shares</b><span>${e.share_timings.n}</span></div>
        </div>
        <table><tr><th>Step</th><th>People</th><th>Of visitors</th></tr>${steps.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td><td>${pct(v, f.visitors)}</td></tr>`).join('')}</table>
        <details><summary>All events</summary><table><tr><th>Event</th><th>Times</th><th>People</th></tr>${Object.entries(e).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.people}</td></tr>`).join('')}</table></details>
        <p class="hint">Counts devices that allowed statistics; visitors in Europe who decline are counted as events without a device id. GA4 and Clarity have the full detail.</p>`;
    }
    // Email (Resend): status, festival-eve sends, campaigns with a test send first.
    async function loadEmail() {
      const r = await fetch('/api/admin/email', { headers: H() }); if (!r.ok) return;
      const m = await r.json();
      document.getElementById('mailCard').innerHTML = `<h2>Email</h2>
        <p class="hint">${m.configured ? `Sending from <strong>${esc(m.from)}</strong> through Resend.` : '<strong>Not connected.</strong> Add RESEND_API_KEY in Railway Variables.'} ${m.audience} people can get email; ${m.pending} have not confirmed yet. Festival emails go out automatically at 9:00 India time the day before Navratri, Karwa Chauth, Dhanteras, Diwali, Chhath, Maha Shivaratri, Holika Dahan, Raksha Bandhan, Janmashtami and Ganesh Chaturthi.</p>
        <form id="mailF" class="form">
          <input name="subject" maxlength="120" placeholder="Subject" required>
          <textarea name="body" rows="6" placeholder="Message. Leave an empty line between paragraphs." required style="font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px"></textarea>
          <input name="url" placeholder="Button opens (path, optional), e.g. /festivals/diwali">
          <div class="two"><input name="langs" placeholder="Languages, e.g. hi,gu (empty = all)"><input name="countries" placeholder="Countries, e.g. IN,AE (empty = all)"></div>
          <div class="two"><input name="test" type="email" placeholder="Your email for a test"><button type="button" class="ghost" id="mailTest">Send test</button></div>
          <button class="primary" ${m.configured ? '' : 'disabled'}>Send to everyone in this segment</button>
        </form>
        ${m.campaigns.length ? `<h3>Sent</h3><table><tr><th>Subject</th><th>Status</th><th>Sent</th></tr>${m.campaigns.map((c) => `<tr><td>${esc(c.subject)}</td><td>${esc(c.status)}</td><td>${c.sent}${c.failed ? ` (${c.failed} failed)` : ''}</td></tr>`).join('')}</table>` : ''}
        ${m.festivalSends.length ? `<h3>Festival emails</h3><table>${m.festivalSends.map((x) => `<tr><td>${esc(x.key)}</td><td>${x.ok} of ${x.n}</td></tr>`).join('')}</table>` : ''}`;
      const f = document.getElementById('mailF');
      const data = (extra) => JSON.stringify({ subject: f.subject.value, body: f.body.value, url: f.url.value, langs: f.langs.value, countries: f.countries.value, ...extra });
      document.getElementById('mailTest').onclick = async () => {
        if (!f.test.value) return alert('Enter your email for the test.');
        const r2 = await fetch('/api/admin/email-campaigns', { method: 'POST', headers: H(), body: data({ test: f.test.value }) });
        const d = await r2.json(); alert(d.ok ? 'Test sent. Check your inbox.' : (d.error || 'Test failed. Check the Resend dashboard.'));
      };
      f.onsubmit = async (e) => {
        e.preventDefault();
        if (!confirm(`Send "${f.subject.value}" now to everyone in this segment?`)) return;
        const r2 = await fetch('/api/admin/email-campaigns', { method: 'POST', headers: H(), body: data({}) });
        const d = await r2.json(); if (!r2.ok) return alert(d.error);
        alert(`Sending to ${d.audience} people.`); f.reset(); setTimeout(loadEmail, 3000);
      };
    }
    // Backups: nightly copies on the volume (and off-site if configured).
    async function loadBackups() {
      const r = await fetch('/api/admin/backups', { headers: H() }); if (!r.ok) return;
      const b = await r.json();
      document.getElementById('bkCard').innerHTML = `<h2>Backups</h2>
        <p class="hint">A copy of the database is made every night and kept for 7 days plus 4 Sundays. ${b.offsite ? 'Each copy is also uploaded off-site.' : '<strong>Off-site copy is not set up:</strong> if the Railway volume is lost, these copies go with it. Set the BACKUP_S3_* variables (see LAUNCH.md), or download a copy here regularly.'}</p>
        <table><tr><th>File</th><th>Size</th><th></th></tr>${b.backups.map((x) => `<tr><td>${esc(x.file)}</td><td>${(x.bytes / 1024).toFixed(0)} KB</td><td><button class="ghost small" data-dl="${esc(x.file)}">Download</button></td></tr>`).join('') || '<tr><td colspan=3>None yet</td></tr>'}</table>
        <button class="ghost" id="bkNow">Back up now</button>`;
      document.querySelectorAll('[data-dl]').forEach((x) => x.onclick = () => download('/api/admin/backups/' + x.dataset.dl, x.dataset.dl));
      document.getElementById('bkNow').onclick = async () => { await fetch('/api/admin/backups', { method: 'POST', headers: H() }); loadBackups(); };
    }
    // Languages: coverage per language, start the translation job, export/import for review.
    async function loadLangs() {
      const tok = sessionStorage.getItem('rk_admin');
      const r = await fetch('/api/admin/translations', { headers: { 'x-admin-token': tok } });
      if (!r.ok) return;
      const d = await r.json(); const j = d.job;
      const pct = (x) => Math.round(x * 100) + '%';
      document.getElementById('trCard').innerHTML = `<h2>Languages</h2>
        <p class="hint">A language goes live (indexed by Google, listed in the sitemap) at 95% of the interface and page text. Articles go live one by one as they are translated. Hindi and Gujarati interfaces are hand-written; everything else is machine-translated by Haiku once and stored.</p>
        <p><strong>Translation job:</strong> ${j.running ? `running, ${esc(j.current || '')}` : j.finishedAt ? `last run ${new Date(j.finishedAt).toLocaleString('en-IN')}` : 'not run yet'} · ${j.done} done, ${j.failed} to retry${j.error ? ` · <span class="q-bad">${esc(j.error)}</span>` : ''}</p>
        <div class="two"><button class="primary" id="trRun" ${j.running ? 'disabled' : ''}>Translate everything missing</button><button class="ghost" id="trRefresh">Refresh</button></div>
        <div class="table-wrap"><table><tr><th>Language</th><th>Live</th><th>Interface</th><th>Pages</th><th>Names</th><th>Explanations</th><th>Review</th></tr>
        ${d.langs.map((l) => `<tr><td>${esc(l.lang)}</td><td>${l.live ? '✓' : ''}</td><td>${pct(l.coverage.app)}</td><td>${pct(l.coverage.seo)}</td><td>${pct(l.coverage.data)}</td><td>${pct(l.coverage.guide)}</td>
          <td><button class="ghost small" data-exp="${l.lang}">Export</button> <label class="ghost small" style="cursor:pointer">Import<input type="file" accept="application/json" data-imp="${l.lang}" hidden></label></td></tr>`).join('')}</table></div>
        <p class="hint">Review: export a language, a native speaker edits the "text" values (any line whose text changes is marked as reviewed), then import the file. Reviewed lines are never overwritten by the machine translation.</p>
        ${j.log.length ? `<details><summary>Job log</summary><pre style="white-space:pre-wrap">${esc(j.log.join('\n'))}</pre></details>` : ''}`;
      document.getElementById('trRefresh').onclick = loadLangs;
      document.getElementById('trRun').onclick = async () => {
        await fetch('/api/admin/translate', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-token': tok }, body: '{}' });
        setTimeout(loadLangs, 1500);
      };
      document.querySelectorAll('[data-exp]').forEach((b) => b.onclick = async () => {
        const res = await fetch('/api/admin/translations/' + b.dataset.exp, { headers: { 'x-admin-token': tok } });
        const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = `rekha-${b.dataset.exp}.json`; a.click();
      });
      document.querySelectorAll('[data-imp]').forEach((inp) => inp.onchange = async () => {
        const body = await inp.files[0].text();
        const res = await fetch('/api/admin/translations/' + inp.dataset.imp, { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-token': tok }, body });
        const out = await res.json(); alert(out.ok ? `Imported ${out.imported} reviewed lines.` : out.error); loadLangs();
      });
    }

    document.addEventListener('submit', async (e) => {
      if (e.target.id === 'cmpF') {
        e.preventDefault();
        const f = e.target;
        const at = f.at.value ? new Date(f.at.value).toISOString() : null;
        const n = document.getElementById('cmpCount').textContent;
        if (!confirm(`${at ? 'Schedule' : 'Send now'}: "${f.title.value}" to ${n.replace('Audience: ', '')}?`)) return;
        const r = await fetch('/api/admin/campaigns', { method: 'POST', headers: H(), body: JSON.stringify({ title: f.title.value, body: f.body.value, url: f.url.value, at, segment: segOf(f) }) });
        const d = await r.json(); if (!r.ok) return alert(d.error);
        f.reset(); loadAudience();
        return;
      }
      if (e.target.id !== 'findF') return;
      e.preventDefault();
      const tok = sessionStorage.getItem('rk_admin');
      const r = await fetch('/api/admin/users?q=' + encodeURIComponent(document.getElementById('findQ').value), { headers: { 'x-admin-token': tok } });
      const users = await r.json();
      const out = document.getElementById('findOut');
      out.innerHTML = users.length ? `<table><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Plan</th><th></th></tr>${users.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.phone || '')}</td><td>${esc(u.email || '')}</td><td>${esc(u.plan)} ${esc(u.plan_status || '')}</td><td><button class="ghost small" data-reset="${esc(u.id)}">Reset password</button></td></tr>`).join('')}</table>` : '<p class="hint">No match.</p>';
      out.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Only reset after confirming the request came from the registered mobile number (e.g. a WhatsApp message from that number). Continue?')) return;
        const rr = await fetch('/api/admin/reset-password', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-token': tok }, body: JSON.stringify({ userId: b.dataset.reset }) });
        const d = await rr.json();
        alert(d.ok ? `Temporary password for ${d.phone || 'this user'}: ${d.tempPassword}\n\nSend it to them privately and ask them to change it under Account.` : d.error);
      }));
    });
    document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); load(document.getElementById('tok').value); });
    try { const t = sessionStorage.getItem('rk_admin'); if (t) load(t); } catch {}
  </script>
</body>
</html>
